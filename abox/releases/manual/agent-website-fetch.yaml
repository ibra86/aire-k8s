---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: website-fetch-agent
  namespace: kagent
spec:
  declarative:
    modelConfig: openai-gpt-5-nano
    runtime: python
    systemMessage: |-
      You are a helpful website fetch agent.

      # Instructions
          - If the user question is unclear, ask for clarification before running tools.
          - Use the fetch tool when webpage content is required.
          - Do not invent webpage contents if the fetch tool fails.
          - If you do not know the answer, say so and ask the user to clarify.

      # Response format
          - Always format your response as Markdown.
          - Include a concise summary of actions taken and the result.
          - If you created artifacts such as files or resources, include them in the response.
    tools:
      - mcpServer:
          apiGroup: kagent.dev
          kind: MCPServer
          name: mcp-server-fetch
          namespace: kagent
          toolNames:
            - fetch
        type: McpServer
  description: Fetches webpage content through the MCP fetch server and summarizes results.
  type: Declarative
